# ============================================================================
# Azure Pipelines MkDocs Deployment Template
# ============================================================================
#
# Purpose: Build and deploy MkDocs (Material theme) documentation to GitHub Pages
# Called by: azure-pipelines.yml (Publication stage / Documentation stage)
# ============================================================================

parameters:
  - name: displayName
    type: string
    default: "Deploy MkDocs to GitHub Pages"
  - name: PublishDocs
    type: boolean
    default: true

jobs:
  - job: MkDocsDeployment
    displayName: ${{ parameters.displayName }}
    pool:
      name: Default
      demands:
        - Agent.OS -equals Linux

    steps:
      - checkout: self
        displayName: Checkout source code
        fetchDepth: 0

      - task: UsePythonVersion@0
        displayName: 'Set up Python 3.x'
        inputs:
          versionSpec: '3.x'
          addToPath: true

      - task: CmdLine@2
        displayName: Install MkDocs and Dependencies
        inputs:
          script: |
            set -e
            python -m pip install --upgrade pip
            pip install -r docs/requirements.txt ghp-import
            echo "✓ Dependencies installed"
            mkdocs --version

      - task: CmdLine@2
        displayName: Build MkDocs Site (--strict)
        inputs:
          script: |
            set -e
            mkdocs build --strict --config-file mkdocs.yml
            echo "✓ MkDocs site built successfully"
            ls -la site/

      - task: CmdLine@2
        displayName: Configure Git Authentication
        inputs:
          script: |
            git config --global user.email "$(GITHUB_USER)"
            git config --global user.name "Azure Pipelines Bot"
            git config --global url."https://$(GITHUB_TOKEN)@github.com/".insteadOf "https://github.com/"
            echo "✓ Git authentication configured"
        env:
          GITHUB_TOKEN: $(GITHUB_TOKEN)
          GITHUB_USER: $(GITHUB_USER)
        condition: and(succeeded(), eq(${{ parameters.PublishDocs }}, true))

      - task: CmdLine@2
        displayName: Deploy to GitHub Pages (gh-pages)
        inputs:
          script: |
            set -e
            echo "Publishing documentation to gh-pages using ghp-import..."
            ghp-import -n -p -f site -b gh-pages -m "Deploy documentation from Azure Pipelines build $(Build.BuildNumber) [Source: $(Build.SourceBranch)]"
            echo "✓ Successfully deployed MkDocs to GitHub Pages"
        env:
          GITHUB_TOKEN: $(GITHUB_TOKEN)
        condition: and(succeeded(), eq(${{ parameters.PublishDocs }}, true))

      - task: PublishBuildArtifacts@1
        displayName: Publish site artifact
        inputs:
          PathtoPublish: site
          ArtifactName: mkdocs-site
          publishLocation: Container
        condition: succeeded()
